<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Panel de edición de videos" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Panel de edición — Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css?v=4" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Menú">
      <div class="sidebar-top">
        <a class="brand" href="#/" data-nav="home">Panel de edición</a>
        <button type="button" class="btn btn-primary btn-block" id="btnNewProject">+ Nuevo proyecto</button>
        <nav class="nav-projects" aria-label="Proyectos">
          <div class="nav-label">Proyectos</div>
          <div id="projectNav"></div>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <a class="nav-item" href="#/settings" data-nav="settings">
          <span class="nav-ico" aria-hidden="true">⚙</span>
          <span>Settings</span>
        </a>
        <a class="nav-item" href="#/settings" data-nav="help">
          <span class="nav-ico" aria-hidden="true">?</span>
          <span>Ayuda</span>
        </a>
      </div>
    </aside>

    <div class="backdrop" id="sidebarBackdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-icon" id="btnMenu" aria-label="Abrir menú">☰</button>
        <div class="topbar-title" id="topbarTitle">Inicio</div>
      </header>
      <main class="content" id="app"></main>
    </div>
  </div>

  <div class="modal" id="modalNew" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Nuevo proyecto</h2>
        <button type="button" class="btn btn-ghost btn-icon" data-close-modal aria-label="Cerrar">✕</button>
      </div>
      <form id="formNew" class="modal-body">
        <label>Nombre del video
          <input name="title" required placeholder="Ej. Mary Cooper — capítulo 1" />
        </label>
        <label>Tema / serie o película
          <input name="theme" placeholder="Ej. The Big Bang Theory / Young Sheldon" />
        </label>
        <label>Canal
          <select name="channel">
            <option value="Canal nuevo">Canal nuevo</option>
            <option value="ZEPFILMS">ZEPFILMS</option>
          </select>
        </label>
        <label>Link del audio (Drive)
          <input name="audioUrl" type="url" placeholder="https://drive.google.com/…" />
        </label>
        <label>Guion (opcional)
          <textarea name="script" rows="4" placeholder="Pega el guion aquí…"></textarea>
        </label>
        <label>Título YouTube (opcional)
          <input name="ytTitle" placeholder="Título clickbait…" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" data-close-modal>Cancelar</button>
          <button type="submit" class="btn btn-primary">Crear borrador</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="js/dashboard.js?v=4"></script>
</body>
</html>
